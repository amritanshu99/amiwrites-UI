      Critical first-paint loader. React replaces this node in its first commit,
      keeping slow devices on one continuous dark surface while the bundle starts.

    <script>
      (() => {
        const pathname = window.location.pathname.replace(/\/+$/, "") || "/";
        const routeLabels = {
          "/add-blog": "Loading Create Blog",
          "/ami-pulse-settings": "Loading Ami Pulse settings",
          "/pulse-settings": "Loading Ami Pulse settings",
          "/beacon-settings": "Loading Ami Pulse settings",
          "/amibot-admin": "Loading AmiBot settings",
        };

        document.documentElement.dataset.bootstrapLoader =
          pathname === "/" ? "showcase" : "route";
        document.documentElement.dataset.bootstrapLoaderLabel =
          routeLabels[pathname] || "Loading page";
      })();
    </script>
