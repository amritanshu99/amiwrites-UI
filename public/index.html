    <!--
      Critical first-paint loader. React replaces this node in its first commit,
      keeping slow devices on one continuous dark surface while the bundle starts.
    -->
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #010101;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
      }

      #app-bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        box-sizing: border-box;
        display: grid;
        height: 100vh;
        height: 100svh;
        place-items: center;
        overflow: hidden;
        padding:
          max(clamp(3.25rem, 6vh, 4.5rem), env(safe-area-inset-top))
          max(1rem, env(safe-area-inset-right))
          max(clamp(3.25rem, 6vh, 4.5rem), env(safe-area-inset-bottom))
          max(1rem, env(safe-area-inset-left));
        color: #fff;
        background:
          radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.1), rgba(12, 12, 12, 0.92) 31%, #000 72%),
          #010101;
        font-family: Cinzel, "Times New Roman", serif;
        isolation: isolate;
      }

      #app-bootstrap-loader::before {
        position: absolute;
        inset: 14px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 2rem;
        content: "";
      }

      .bootstrap-loader__badges {
        position: absolute;
        top: max(0.75rem, env(safe-area-inset-top));
        right: max(0.75rem, env(safe-area-inset-right));
        left: max(0.75rem, env(safe-area-inset-left));
        display: flex;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .bootstrap-loader__badge {
        max-width: calc(50vw - 1.25rem);
        overflow: hidden;
        padding: 0.5rem 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.82);
        font: 500 0.46rem/1 system-ui, sans-serif;
        letter-spacing: 0.24em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .bootstrap-loader__stage {
        position: relative;
        box-sizing: border-box;
        width: min(92vw, 64rem);
        max-height: 100%;
        padding: clamp(1rem, 4vh, 3.5rem) clamp(1rem, 4vw, 3.5rem);
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: clamp(1.55rem, 5vw, 2.2rem);
        text-align: center;
        background:
          radial-gradient(circle at 50% 12%, rgba(255, 255, 255, 0.09), transparent 38%),
          linear-gradient(180deg, rgba(10, 10, 10, 0.94), rgba(0, 0, 0, 0.9) 48%, rgba(4, 4, 4, 0.96));
        box-shadow:
          0 32px 110px rgba(0, 0, 0, 0.88),
          inset 0 1px 0 rgba(255, 255, 255, 0.045),
          inset 0 -1px 0 rgba(255, 255, 255, 0.018);
        animation: bootstrapStageCue 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .bootstrap-loader__stage::before {
        position: absolute;
        inset: clamp(0.85rem, 2.4vw, 1.4rem);
        border-radius: calc(1.55rem - 0.5rem);
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0)) left top / 2.25rem 1px no-repeat,
          linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0)) left top / 1px 2.25rem no-repeat,
          linear-gradient(270deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0)) right bottom / 2.25rem 1px no-repeat,
          linear-gradient(0deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0)) right bottom / 1px 2.25rem no-repeat;
        content: "";
        opacity: 0.42;
        pointer-events: none;
      }

      .bootstrap-loader__stage::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(112deg, transparent 18%, rgba(255, 255, 255, 0.028) 43%, transparent 63%);
        content: "";
        opacity: 0.7;
        pointer-events: none;
      }

      .bootstrap-loader__stage > * {
        position: relative;
        z-index: 1;
      }

      .bootstrap-loader__eyebrow,
      .bootstrap-loader__intro,
      .bootstrap-loader__quote,
      .bootstrap-loader__status {
        margin: 0;
        color: rgba(255, 255, 255, 0.6);
        font: 500 clamp(0.5rem, 1.5vw, 0.66rem)/1.4 system-ui, sans-serif;
        letter-spacing: clamp(0.28em, 1vw, 0.58em);
        text-transform: uppercase;
      }

      .bootstrap-loader__emblem {
        position: relative;
        display: grid;
        width: clamp(4.75rem, min(17vh, 24vw), 8rem);
        height: clamp(4.75rem, min(17vh, 24vw), 8rem);
        margin: clamp(0.5rem, 1.9vh, 1.5rem) auto 0;
        place-items: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.09), rgba(0, 0, 0, 0.84) 64%);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.62), 0 0 50px rgba(255, 255, 255, 0.05), inset 0 0 28px rgba(255, 255, 255, 0.035);
      }

      .bootstrap-loader__emblem::before {
        position: absolute;
        inset: 11%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        content: "";
      }

      .bootstrap-loader__emblem img {
        position: relative;
        width: 42%;
        height: 42%;
        border-radius: 0.85rem;
        object-fit: contain;
      }

      .bootstrap-loader__title {
        margin: clamp(0.75rem, 2vh, 1.35rem) 0 0;
        color: #fff;
        font-size: clamp(2rem, min(8.4vw, 7.6vh), 4.5rem);
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: clamp(0.08em, 2vw, 0.2em);
        text-transform: uppercase;
        text-shadow: 0 18px 40px rgba(0, 0, 0, 0.9);
      }

      .bootstrap-loader__divider {
        width: min(11rem, 58%);
        height: 1px;
        margin: clamp(0.85rem, 2vh, 1.25rem) auto 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      }

      .bootstrap-loader__divider--top {
        width: min(8rem, 44%);
      }

      .bootstrap-loader__intro {
        margin: clamp(0.8rem, 2vh, 1.25rem) 0 0;
        color: rgba(255, 255, 255, 0.46);
        font-size: clamp(0.5rem, 1.35vw, 0.64rem);
        letter-spacing: clamp(0.18em, 0.8vw, 0.4em);
      }

      .bootstrap-loader__quote {
        margin: clamp(0.8rem, 2vh, 1.25rem) 0 0;
        color: rgba(255, 255, 255, 0.72);
        font-size: clamp(0.58rem, 1.5vw, 0.76rem);
        font-style: italic;
        letter-spacing: clamp(0.08em, 0.7vw, 0.16em);
      }

      .bootstrap-loader__rail {
        width: min(30rem, 100%);
        height: 3px;
        margin: clamp(1rem, 2.8vh, 1.9rem) auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
      }

      .bootstrap-loader__rail::after {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        content: "";
        animation: bootstrapLoaderTravel 1.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }

      .bootstrap-loader__status {
        margin-top: clamp(0.5rem, 1.9vh, 1.5rem);
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: clamp(0.2em, 1vw, 0.4em);
      }

      .bootstrap-loader__eyebrow,
      .bootstrap-loader__divider--top {
        animation: bootstrapTextCue 560ms cubic-bezier(0.22, 1, 0.36, 1) 40ms both;
      }

      .bootstrap-loader__emblem {
        animation: bootstrapEmblemCue 620ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }

      .bootstrap-loader__intro {
        animation: bootstrapTextCue 560ms cubic-bezier(0.22, 1, 0.36, 1) 130ms both;
      }

      .bootstrap-loader__title {
        animation: bootstrapTitleCue 620ms cubic-bezier(0.22, 1, 0.36, 1) 170ms both;
      }

      .bootstrap-loader__divider:not(.bootstrap-loader__divider--top),
      .bootstrap-loader__quote {
        animation: bootstrapQuoteCue 580ms cubic-bezier(0.22, 1, 0.36, 1) 230ms both;
      }

      .bootstrap-loader__rail,
      .bootstrap-loader__status {
        animation: bootstrapTextCue 520ms cubic-bezier(0.22, 1, 0.36, 1) 300ms both;
      }

      @keyframes bootstrapStageCue {
        from {
          opacity: 0.86;
          transform: translate3d(0, 7px, 0) scale(0.994);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes bootstrapTextCue {
        from {
          opacity: 0;
          transform: translate3d(0, 4px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes bootstrapEmblemCue {
        from {
          opacity: 0;
          transform: translate3d(0, 6px, 0) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes bootstrapTitleCue {
        from {
          opacity: 0;
          filter: blur(2px);
          transform: translate3d(0, 6px, 0);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes bootstrapQuoteCue {
        from {
          opacity: 0;
          transform: translate3d(0, 4px, 0);
        }
        to {
          opacity: 0.9;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes bootstrapLoaderTravel {
        from {
          opacity: 0;
          transform: translate3d(-110%, 0, 0);
        }
        18%,
        78% {
          opacity: 0.9;
        }
        to {
          opacity: 0;
          transform: translate3d(340%, 0, 0);
        }
      }

      @media (max-height: 600px) {
        #app-bootstrap-loader {
          padding-top: max(1rem, env(safe-area-inset-top));
          padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        .bootstrap-loader__eyebrow,
        .bootstrap-loader__divider--top,
        .bootstrap-loader__status {
          display: none;
        }

        .bootstrap-loader__stage {
          padding: 0.75rem 1rem;
        }

        .bootstrap-loader__emblem {
          width: clamp(3.4rem, min(18vh, 18vw), 5.5rem);
          height: clamp(3.4rem, min(18vh, 18vw), 5.5rem);
          margin-top: 0;
        }

        .bootstrap-loader__intro,
        .bootstrap-loader__quote {
          margin-top: 0.55rem;
          font-size: 0.52rem;
          letter-spacing: 0.12em;
        }

        .bootstrap-loader__title,
        .bootstrap-loader__divider,
        .bootstrap-loader__rail {
          margin-top: 0.6rem;
        }
      }

      @media (max-height: 500px) {
        #app-bootstrap-loader {
          padding-top: max(0.55rem, env(safe-area-inset-top));
          padding-bottom: max(0.55rem, env(safe-area-inset-bottom));
        }

        .bootstrap-loader__badges,
        .bootstrap-loader__intro,
        .bootstrap-loader__quote {
          display: none;
        }

        .bootstrap-loader__stage {
          padding-block: 1.15rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bootstrap-loader__stage,
        .bootstrap-loader__eyebrow,
        .bootstrap-loader__divider,
        .bootstrap-loader__emblem,
        .bootstrap-loader__intro,
        .bootstrap-loader__title,
        .bootstrap-loader__quote,
        .bootstrap-loader__rail,
        .bootstrap-loader__status {
          animation: none;
        }

        .bootstrap-loader__rail::after {
          width: 100%;
          opacity: 0.72;
          animation: none;
        }
      }
    </style>
